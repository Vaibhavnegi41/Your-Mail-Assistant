<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Envelope Body Gradient -->
    <linearGradient id="mailBody" x1="8" y1="18" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Top Flap Gradient -->
    <linearGradient id="mailFlap" x1="30" y1="16" x2="30" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Bottom/Side Fold Gradient -->
    <linearGradient id="mailFold" x1="6" y1="52" x2="54" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- AI Sparkle Star Gradient -->
    <linearGradient id="goldStar" x1="40" y1="4" x2="58" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Sticker Depth Shadow -->
    <filter id="stickerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.5"/>
    </filter>

    <!-- Sparkle Glow -->
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#fbbf24" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Envelope Graphic (Cutout with transparent background) -->
  <g filter="url(#stickerShadow)">
    <!-- Base Envelope with Die-Cut Outline -->
    <rect x="6" y="18" width="48" height="34" rx="8" fill="url(#mailBody)" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>

    <!-- Inner fold shadows for 3D depth -->
    <path d="M 6.5,21 L 30,36 L 6.5,49 Z" fill="#172554" opacity="0.45"/>
    <path d="M 53.5,21 L 30,36 L 53.5,49 Z" fill="#172554" opacity="0.45"/>

    <!-- Bottom Front Fold (Pocket) -->
    <path d="M 6,44 L 6,46 C 6,49.8 9.2,52 13,52 L 47,52 C 50.8,52 54,49.8 54,46 L 54,44 L 32,35.2 C 30.8,34.7 29.2,34.7 28,35.2 Z" fill="url(#mailFold)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>

    <!-- Top Flap (Crisp V-Fold) -->
    <path d="M 6.8,20.2 C 8.2,18.8 10.2,18 12.5,18 L 47.5,18 C 49.8,18 51.8,18.8 53.2,20.2 L 31.8,33.5 C 30.7,34.2 29.3,34.2 28.2,33.5 Z" fill="url(#mailFlap)" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>

    <!-- Flap Gloss Highlight Line -->
    <path d="M 7.5,20.5 L 29,33.5 C 29.6,33.9 30.4,33.9 31,33.5 L 52.5,20.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Primary AI Sparkle Star (Top-right sticker badge) -->
  <g filter="url(#sparkleGlow)">
    <path d="M 49,4 C 49.5,9.5 51.8,11.8 57.5,12.5 C 51.8,13.2 49.5,15.5 49,21 C 48.5,15.5 46.2,13.2 40.5,12.5 C 46.2,11.8 48.5,9.5 49,4 Z" fill="url(#goldStar)" stroke="#ffffff" stroke-width="0.6"/>
    <!-- Central White Shimmer Core -->
    <circle cx="49" cy="12.5" r="1.6" fill="#ffffff"/>
  </g>

  <!-- Secondary Mini Sparkle Accent (Top-left) -->
  <g>
    <path d="M 12,9 C 12.3,11.5 13.5,12.7 16,13 C 13.5,13.3 12.3,14.5 12,17 C 11.7,14.5 10.5,13.3 8,13 C 10.5,12.7 11.7,11.5 12,9 Z" fill="#38bdf8" opacity="0.95"/>
    <circle cx="12" cy="13" r="0.9" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
