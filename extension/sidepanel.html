<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Email Assistant - Side Panel</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030712;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .fallback-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px;
      text-align: center;
      background: #0b1120;
      box-sizing: border-box;
    }
    .fallback-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }
    .fallback-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    .fallback-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .fallback-btn {
      padding: 9px 18px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    .fallback-btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <iframe id="app-frame" src="http://localhost:3001" title="AI Email Assistant Next.js Panel"></iframe>
  <div id="fallback" class="fallback-container">
    <div class="fallback-icon">✉️</div>
    <div class="fallback-title">Frontend Server Not Detected</div>
    <div class="fallback-desc">
      Make sure your Next.js application is running on <code>http://localhost:3000</code> or <code>http://localhost:3001</code>.
    </div>
    <button class="fallback-btn" id="retry-btn">Retry Connection</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
