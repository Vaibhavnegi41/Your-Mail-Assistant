<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Email Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100%; height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      overflow: hidden;
    }

    /* ── App iframe (fills full sidepanel) ─────────────────────── */
    #app-frame {
      width: 100%; height: 100%;
      border: none; display: none;
    }

    /* ── Auth Screen (Clean, non-theoretical) ──────────────────── */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 32px 24px;
      text-align: center;
      background: #000;
    }

    .auth-logo {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 0 28px rgba(59,130,246,0.3);
    }

    .auth-title {
      font-size: 19px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .auth-subtitle {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
      max-width: 250px;
    }

    /* Google Sign-In button */
    #sign-in-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 22px;
      background: #fff;
      color: #1f2937;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 240px;
      justify-content: center;
    }
    #sign-in-btn:hover { background: #f3f4f6; transform: translateY(-1px); }
    #sign-in-btn:active { transform: translateY(0); }
    #sign-in-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .google-icon {
      width: 18px; height: 18px; flex-shrink: 0;
    }

    .auth-error {
      margin-top: 14px;
      font-size: 12px;
      color: #f87171;
      display: none;
      max-width: 260px;
      line-height: 1.4;
    }

    /* ── Loading spinner overlay ────────────────────────────────── */
    #loading-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 14px;
      background: #000;
    }

    .spinner {
      width: 32px; height: 32px;
      border: 2.5px solid #1e293b;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Loading state -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text" style="text-align:center; padding: 0 16px;">Loading...</div>
    <button id="cancel-loading-btn" style="display:none; margin-top:14px; background:transparent; border:1px solid #334155; color:#94a3b8; border-radius:6px; padding:6px 14px; font-size:12px; cursor:pointer;">Cancel</button>
  </div>

  <!-- Auth / Sign-in screen (Clean, minimal) -->
  <div id="auth-screen">
    <div class="auth-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
    </div>

    <div class="auth-title">AI Email Assistant</div>
    <div class="auth-subtitle">
      Generate & review smart AI email drafts directly in Gmail.
    </div>

    <button id="sign-in-btn">
      <!-- Google "G" SVG icon -->
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-error" id="auth-error"></div>
  </div>

  <!-- App iframe takes 100% full screen when signed in -->
  <iframe id="app-frame" title="AI Email Assistant"></iframe>

  <script src="sidepanel.js"></script>
</body>
</html>
