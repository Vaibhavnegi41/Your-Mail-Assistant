<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Email Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100%; height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      overflow: hidden;
    }

    /* ── App iframe (shown after sign-in) ─────────────────────── */
    #app-frame {
      width: 100%; height: 100%;
      border: none; display: none;
    }

    /* ── Auth Screen ───────────────────────────────────────────── */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 32px 24px;
      text-align: center;
      background: #000;
    }

    .auth-logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin-bottom: 20px;
      box-shadow: 0 0 32px rgba(59,130,246,0.25);
    }

    .auth-title {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .auth-subtitle {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 28px;
      max-width: 240px;
    }

    /* Google Sign-In button */
    #sign-in-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 20px;
      background: #fff;
      color: #1f2937;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 240px;
      justify-content: center;
    }
    #sign-in-btn:hover { background: #f3f4f6; transform: translateY(-1px); }
    #sign-in-btn:active { transform: translateY(0); }
    #sign-in-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .google-icon {
      width: 18px; height: 18px; flex-shrink: 0;
    }

    .auth-error {
      margin-top: 14px;
      font-size: 12px;
      color: #f87171;
      display: none;
    }

    .auth-privacy {
      margin-top: 20px;
      font-size: 11px;
      color: #374151;
      line-height: 1.5;
    }

    /* ── Loading spinner overlay ────────────────────────────────── */
    #loading-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 14px;
      background: #000;
    }

    .spinner {
      width: 32px; height: 32px;
      border: 2.5px solid #1e293b;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 13px;
      color: #475569;
    }

    /* ── User bar (shown inside app screen) ─────────────────────── */
    #user-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: #080808;
      border-bottom: 1px solid #111;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      font-size: 11px;
      color: #64748b;
    }
    #user-bar .user-email { color: #94a3b8; font-weight: 500; }
    #sign-out-btn {
      background: none;
      border: 1px solid #1e293b;
      color: #64748b;
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #sign-out-btn:hover { border-color: #374151; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- Loading state -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>

  <!-- Auth / Sign-in screen -->
  <div id="auth-screen">
    <div class="auth-logo">✉️</div>
    <div class="auth-title">AI Email Assistant</div>
    <div class="auth-subtitle">
      Sign in with your Google account to generate, review, and send AI-drafted emails directly from Gmail.
    </div>

    <button id="sign-in-btn">
      <!-- Google "G" SVG icon -->
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-error" id="auth-error"></div>

    <div class="auth-privacy">
      We only request permission to send emails on your behalf.<br>
      Your data is never stored without your approval.
    </div>
  </div>

  <!-- Signed-in: user bar + app iframe -->
  <div id="user-bar">
    <span class="user-email" id="user-email-label"></span>
    <button id="sign-out-btn">Sign out</button>
  </div>

  <iframe id="app-frame" title="AI Email Assistant"></iframe>

  <script src="sidepanel.js"></script>
</body>
</html>
