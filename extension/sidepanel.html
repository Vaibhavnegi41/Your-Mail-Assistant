<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Email Assistant</title>
  <link rel="icon" type="image/png" href="icons/icon48.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100%; height: 100%;
      background: #04060c;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
      overflow: hidden;
      position: relative;
    }

    /* ── App iframe (fills full sidepanel) ─────────────────────── */
    #app-frame {
      width: 100%; height: 100%;
      border: none; display: none;
      position: relative;
      z-index: 10;
    }

    /* ── Ambient Glow Background Effects ──────────────────────── */
    .bg-canvas {
      position: absolute;
      inset: 0;
      background-color: #04060c;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(56, 189, 248, 0.22), transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(139, 92, 246, 0.18), transparent 60%);
      background-size: 20px 20px, 100% 100%, 100% 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    /* Animated Ambient Gradient Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: orbFloat 14s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 220px; height: 220px;
      top: -40px; left: -40px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      animation-duration: 12s;
    }
    .orb-2 {
      width: 260px; height: 260px;
      bottom: -60px; right: -60px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      animation-duration: 16s;
    }
    .orb-3 {
      width: 180px; height: 180px;
      top: 45%; left: 60%;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      opacity: 0.3;
      animation-duration: 18s;
    }

    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(25px, -30px) scale(1.1); }
      100% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* ── Auth Screen Container ─────────────────────────────────── */
    #auth-screen {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px 18px;
      text-align: center;
      overflow-y: auto;
      scrollbar-width: none;
    }
    #auth-screen::-webkit-scrollbar { display: none; }

    /* Frosted Glass Card */
    .auth-card {
      width: 100%;
      max-width: 340px;
      background: rgba(13, 17, 28, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      padding: 30px 20px 24px;
      box-shadow: 
        0 20px 50px -10px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(56, 189, 248, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Pill Tag */
    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      letter-spacing: 0.3px;
      margin-bottom: 20px;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulseDot 2s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.8); }
    }

    /* Logo Frame with Glow */
    .auth-logo-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .auth-logo-glow {
      position: absolute;
      inset: -6px;
      border-radius: 20px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      opacity: 0.6;
      filter: blur(10px);
      z-index: 0;
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0%   { opacity: 0.45; filter: blur(8px); }
      100% { opacity: 0.8;  filter: blur(14px); }
    }

    .auth-logo {
      position: relative;
      z-index: 1;
      width: 58px; height: 58px;
      background: linear-gradient(145deg, #0f172a, #0b1120);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 17px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .auth-logo img {
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
    }

    /* Typography */
    .auth-title {
      font-size: 21px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: -0.4px;
    }

    .auth-subtitle {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
      max-width: 270px;
    }

    /* Feature Highlights */
    .features-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
      text-align: left;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .feature-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateX(2px);
    }

    .feature-icon-badge {
      width: 26px; height: 26px;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
    }
    .badge-blue   { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .badge-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
    .badge-green  { background: rgba(52, 211, 153, 0.15); color: #34d399; }

    .feature-text {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.35;
    }
    .feature-text strong {
      color: #f8fafc;
      font-weight: 600;
    }

    /* Google Sign-In Button */
    #sign-in-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 12px 20px;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 
        0 4px 16px rgba(0, 0, 0, 0.4),
        0 0 20px rgba(255, 255, 255, 0.15);
    }
    #sign-in-btn:hover {
      background: #f8fafc;
      transform: translateY(-2px);
      box-shadow: 
        0 8px 24px rgba(0, 0, 0, 0.5),
        0 0 28px rgba(255, 255, 255, 0.3);
    }
    #sign-in-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    #sign-in-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .google-icon {
      width: 19px; height: 19px;
      flex-shrink: 0;
    }

    /* Security Note */
    .auth-security-note {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #64748b;
      margin-top: 14px;
    }

    .auth-error {
      margin-top: 14px;
      font-size: 12px;
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 8px;
      padding: 8px 12px;
      display: none;
      max-width: 100%;
      line-height: 1.4;
    }

    /* ── Loading Screen ────────────────────────────────────────── */
    #loading-screen {
      position: relative;
      z-index: 2;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      padding: 24px;
    }

    .spinner-wrap {
      position: relative;
      width: 48px; height: 48px;
    }
    .spinner-track {
      position: absolute;
      inset: 0;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }
    .spinner {
      position: absolute;
      inset: 0;
      border: 3px solid transparent;
      border-top-color: #38bdf8;
      border-right-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      text-align: center;
      max-width: 260px;
      line-height: 1.5;
    }
    #cancel-loading-btn {
      display: none;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #cancel-loading-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <!-- Background Ambient Glow & Grid -->
  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Loading state -->
  <div id="loading-screen">
    <div class="spinner-wrap">
      <div class="spinner-track"></div>
      <div class="spinner"></div>
    </div>
    <div class="loading-text" id="loading-text">Loading...</div>
    <button id="cancel-loading-btn">Cancel</button>
  </div>

  <!-- Auth / Sign-in screen -->
  <div id="auth-screen">
    <div class="auth-card">
      <!-- Tag Badge -->
      <div class="auth-badge">
        <span class="badge-dot"></span>
        AI-Powered Studio
      </div>

      <!-- Glowing Brand Logo -->
      <div class="auth-logo-wrap">
        <div class="auth-logo-glow"></div>
        <div class="auth-logo">
          <img src="icons/icon48.png" alt="AI Email Assistant" width="36" height="36" style="object-fit: contain;" />
        </div>
      </div>

      <!-- Title & Subtitle -->
      <div class="auth-title">AI Email Assistant</div>
      <div class="auth-subtitle">
        Let AI Handle the Drafting. You Stay in Control of Every Send.
      </div>

      

      <!-- Sign In Button -->
      <button id="sign-in-btn">
        <!-- Google "G" SVG icon -->
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      

      <div class="auth-error" id="auth-error"></div>
    </div>
  </div>

  <!-- App iframe takes 100% full screen when signed in -->
  <iframe id="app-frame" title="AI Email Assistant"></iframe>

  <script src="sidepanel.js"></script>
</body>
</html>
